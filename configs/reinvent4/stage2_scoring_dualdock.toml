### Stage 2 scoring components (DualDock)

[[component]]
[component.QED]

[[component.QED.endpoint]]
weight = 0.2
name = "QED Score"

# DualDock external scorer: returns "boltz2_score" in [0..1]
[[component]]
[component.ExternalProcess]

[[component.ExternalProcess.endpoint]]
name = "DualDock"
weight = 0.8

[component.ExternalProcess.endpoint.params]
executable = "/usr/bin/env"
args = "bash scripts/dualdock_external.sh"
property = "boltz2_score"
